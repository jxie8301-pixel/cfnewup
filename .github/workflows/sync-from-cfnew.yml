name: 从 cfnew 同步 Releases

on:
  workflow_dispatch:
    inputs:
      force:
        description: '强制重新同步并混淆（即使版本号相同）'
        type: boolean
        default: false
  schedule:
    - cron: '0 */6 * * *'   # 每 6 小时自动检查

# 允许 Action 向仓库 push
permissions:
  contents: write

# 防止定时触发与手动触发并发冲突
concurrency:
  group: sync-cfnew-release
  cancel-in-progress: false

jobs:
  sync-release:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ============================================================
      # 1. 获取上游最新 Release 信息
      # ============================================================
      - name: 获取 cfnew 最新发布
        id: get_latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          echo "正在获取最新 Release 信息..."
          RESP=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/byJoey/cfnew/releases/latest)

          VERSION=$(echo "$RESP" | jq -r '.tag_name // empty')
          if [ -z "$VERSION" ]; then
            echo "::error::未能获取版本号，API 返回前 30 行："
            echo "$RESP" | head -30
            exit 1
          fi
          echo "最新版本: $VERSION"

          ASSETS_URL=$(echo "$RESP" | jq -r '.assets_url // empty')
          ASSETS=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "$ASSETS_URL")

          DOWNLOAD_URL=$(echo "$ASSETS" \
            | jq -r '.[] | select(.name=="Pages.zip") | .browser_download_url' \
            | head -1)

          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            echo "::error::未找到 Pages.zip，可用的文件列表："
            echo "$ASSETS" | jq -r '.[].name' | sed 's/^/  - /'
            exit 1
          fi

          {
            echo "version=$VERSION"
            echo "download_url=$DOWNLOAD_URL"
            echo "file_name=Pages.zip"
          } >> "$GITHUB_OUTPUT"

          echo "下载 URL: $DOWNLOAD_URL"

      # ============================================================
      # 2. 版本对比（支持 force 强制重跑）
      # ============================================================
      - name: 检查当前版本
        id: check_version
        run: |
          set -euo pipefail

          if [ -f "VERSION.txt" ]; then
            CURRENT_VERSION=$(tr -d '\r\n' < VERSION.txt)
          else
            CURRENT_VERSION=""
          fi

          NEW_VERSION="${{ steps.get_latest.outputs.version }}"
          FORCE="${{ inputs.force }}"

          {
            echo "current_version=$CURRENT_VERSION"
            echo "latest_version=$NEW_VERSION"
          } >> "$GITHUB_OUTPUT"

          if [ "$FORCE" = "true" ]; then
            echo "🚀 强制模式：将重新下载并混淆"
            echo "need_update=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$CURRENT_VERSION" ] || [ "$CURRENT_VERSION" != "$NEW_VERSION" ]; then
            echo "发现新版本: '$CURRENT_VERSION' -> '$NEW_VERSION'"
            echo "need_update=true" >> "$GITHUB_OUTPUT"
          else
            echo "版本相同，无需更新"
            echo "need_update=false" >> "$GITHUB_OUTPUT"
          fi

      # ============================================================
      # 3. 下载、解压并混淆 _worker.js
      # ============================================================
      - name: 下载、解压并混淆
        if: steps.check_version.outputs.need_update == 'true'
        env:
          DOWNLOAD_URL: ${{ steps.get_latest.outputs.download_url }}
          FILE_NAME:    ${{ steps.get_latest.outputs.file_name }}
          VERSION:      ${{ steps.get_latest.outputs.version }}
        run: |
          set -euo pipefail

          # --- 下载 ---
          echo "正在下载: $FILE_NAME"
          curl -fsSL -o "$FILE_NAME" "$DOWNLOAD_URL"

          # --- 解压 ---
          echo "正在解压..."
          unzip -o "$FILE_NAME" -d .
          rm -f "$FILE_NAME"

          if [ ! -f "_worker.js" ]; then
            echo "::error::解压后未找到 _worker.js，当前目录内容："
            ls -la
            exit 1
          fi

          # --- 备份原始文件，便于出错回滚 ---
          cp _worker.js /tmp/_worker.orig.js
          ORIG_SIZE=$(wc -c < _worker.js)
          echo "混淆前大小: ${ORIG_SIZE} bytes"

          # --- 混淆（固定 seed，保证输出稳定） ---
          echo "正在混淆 _worker.js ..."
          if ! npx --yes javascript-obfuscator@4.1.0 _worker.js \
              --output _worker.js \
              --seed 20260120 \
              --compact true \
              --rename-globals false \
              --identifier-names-generator hexadecimal \
              --control-flow-flattening true \
              --control-flow-flattening-threshold 0.5 \
              --dead-code-injection false \
              --string-array true \
              --string-array-encoding base64 \
              --string-array-threshold 0.75 \
              --string-array-rotate true \
              --string-array-shuffle true \
              --split-strings true \
              --self-defending false \
              --debug-protection false \
              --disable-console-output false \
              --target browser; then
            echo "::error::混淆失败，回滚到原始文件"
            cp /tmp/_worker.orig.js _worker.js
            exit 1
          fi

          NEW_SIZE=$(wc -c < _worker.js)
          echo "混淆后大小: ${NEW_SIZE} bytes"
          echo "体积变化: $(( NEW_SIZE * 100 / ORIG_SIZE ))% （相对原始）"

          # --- 语法校验（_worker.js 是 ESM，需按 .mjs 校验） ---
          echo "正在校验语法..."
          cp _worker.js /tmp/_worker.check.mjs
          if ! node --check /tmp/_worker.check.mjs; then
            echo "::error::混淆后语法错误，回滚到原始文件"
            cp /tmp/_worker.orig.js _worker.js
            exit 1
          fi
          echo "✓ 语法校验通过"

          # --- 写入版本号 ---
          echo "$VERSION" > VERSION.txt
          echo "✓ 版本记录已更新: $VERSION"

      # ============================================================
      # 4. 提交并推送
      # ============================================================
      - name: 提交并推送更改
        if: steps.check_version.outputs.need_update == 'true'
        run: |
          set -euo pipefail

          git config --local user.email "action@github.com"
          git config --local user.name  "GitHub Action"

          # 只提交明确需要的文件，避免误提交中间产物
          git add VERSION.txt
          # 解压出的内容一并加入（如需精确控制，可换成具体文件列表）
          git add -A

          if git diff --staged --quiet; then
            echo "没有变更需要提交"
          else
            git commit -m "自动同步: 更新到 cfnew ${{ steps.get_latest.outputs.version }}"
            # 万一远端在本次运行期间被更新，先 rebase 再推
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push
            echo "✓ 已提交并推送更新"
          fi

      # ============================================================
      # 5. 输出摘要
      # ============================================================
      - name: 输出摘要
        if: always()
        run: |
          {
            echo "## 同步结果"
            echo ""
            echo "| 项 | 值 |"
            echo "|----|----|"
            echo "| 最新版本 | \`${{ steps.get_latest.outputs.version }}\` |"
            echo "| 当前版本 | \`${{ steps.check_version.outputs.current_version }}\` |"
            if [ "${{ steps.check_version.outputs.need_update }}" = "true" ]; then
              echo "| 状态 | ✅ 已同步并混淆 |"
            else
              echo "| 状态 | ⏭️ 版本相同，无需更新 |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
